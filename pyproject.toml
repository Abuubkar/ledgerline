[project]
name = "ledgerline"
version = "0.1.0"
description = "Workspace root: dev tooling and scripts. App code lives in apps/."
requires-python = ">=3.13"
dependencies = ["ledgerline-api", "ledgerline-erp-mock"]

[dependency-groups]
dev = [
    "ledgerline-client",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "openapi-python-client>=0.29.1",
    "pytest>=9.2.0",
    "testcontainers>=4.15.0",
    "faker==40.44.0",
    "scipy>=1.18.1",
    "rapidfuzz>=3.14.6",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/erp_mock", "packages/clients/python"]

[tool.uv.sources]
ledgerline-api = { workspace = true }
ledgerline-erp-mock = { workspace = true }
ledgerline-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "evals/tests"]
# Eval tests import the evals package from the repo root.
pythonpath = ["."]
markers = ["integration: needs Docker (testcontainers); run with make test-int"]
addopts = "--strict-markers"
