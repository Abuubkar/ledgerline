[project]
name = "ledgerline"
version = "0.1.0"
description = "Workspace root: dev tooling and scripts. App code lives in apps/."
requires-python = ">=3.13"
dependencies = ["ledgerline-api", "ledgerline-erp-mock"]

[dependency-groups]
dev = [
    "ledgerline-client",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "openapi-python-client>=0.29.1",
    "pytest>=9.2.0",
    "testcontainers>=4.15.0",
    "faker==40.44.0",
    "scipy>=1.18.1",
    "rapidfuzz>=3.14.6",
    "pyyaml>=6.0.3",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/erp_mock", "packages/clients/python", "packages/telemetry"]

[tool.uv.sources]
ledgerline-api = { workspace = true }
ledgerline-erp-mock = { workspace = true }
ledgerline-client = { workspace = true }
ledgerline-telemetry = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "evals/tests", "packages/telemetry/tests"]
# Eval tests import the evals package from the repo root.
pythonpath = ["."]
markers = ["integration: needs Docker (testcontainers); run with make test-int"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 120
# Generated by openapi-python-client (make codegen); never edited by hand.
extend-exclude = ["packages/clients/python"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes and the pycodestyle errors) plus import order and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# `l` is the codebase's name for an invoice line in one-line comprehensions (`for l in inv.lines`).
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["ledgerline_api", "ledgerline_erp_mock", "ledgerline_client", "ledgerline_telemetry", "evals"]

[tool.mypy]
# Normal (not strict) mode on our own code: catches wrong types where they're declared, without demanding
# annotations everywhere. Libraries without type hints are treated as Any.
files = ["apps/api/src", "apps/erp_mock/src", "packages/telemetry/src", "evals"]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
