# Run the published, signed images (ADR 0019) instead of building locally, on top of docker-compose.yml. One command
# brings up everything: migrations, the app and the observability stack (ADR 0024).
#
#   export LEDGERLINE_TAG=sha-8016aa6    # a release; `main` is the latest merge. Pin one so you know what runs.
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --wait
#
# The API (http://localhost:8000) and the reviewer UI (http://localhost:3000) run in containers here, unlike in
# development; Grafana is on http://localhost:3001 and Jaeger on http://localhost:16686. Ollama still runs on the
# host. Verify an image before trusting it: the cosign command in ADR 0019.
x-release-image: &pull
  pull_policy: always  # use the published image; never build these locally

x-migrated: &migrated
  depends_on:
    migrate: {condition: service_completed_successfully}

x-traced: &traced
  # Unlike development, telemetry is on: the release runs the collector too.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  # Applies migrations once, before anything that reads the database starts.
  migrate:
    extends: {file: docker-compose.yml, service: worker}
    image: ghcr.io/abuubkar/ledgerline-api:${LEDGERLINE_TAG:-main}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    <<: *pull

  api:
    extends: {file: docker-compose.yml, service: worker}  # same environment and dependencies as the worker
    image: ghcr.io/abuubkar/ledgerline-api:${LEDGERLINE_TAG:-main}
    command: ["uvicorn", "ledgerline_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    <<: [*pull, *migrated]
    environment: *traced
    ports:
      - "8000:8000"

  web:
    # Proxies /graphql and /v1 to http://api:8000, the address built into the image.
    image: ghcr.io/abuubkar/ledgerline-web:${LEDGERLINE_TAG:-main}
    <<: *pull
    ports:
      - "3000:3000"
    depends_on: [api]

  worker:
    image: ghcr.io/abuubkar/ledgerline-worker:${LEDGERLINE_TAG:-main}
    <<: [*pull, *migrated]
    environment: *traced
  relay:
    image: ghcr.io/abuubkar/ledgerline-worker:${LEDGERLINE_TAG:-main}
    <<: [*pull, *migrated]
    environment: *traced
  beat:
    image: ghcr.io/abuubkar/ledgerline-worker:${LEDGERLINE_TAG:-main}
    <<: [*pull, *migrated]
    environment: *traced
  erp_mock:
    image: ghcr.io/abuubkar/ledgerline-erp-mock:${LEDGERLINE_TAG:-main}
    <<: *pull
    environment: *traced

  # The observability stack runs by default here; in development it stays behind `--profile observability`.
  otel-collector: {profiles: !reset []}
  jaeger: {profiles: !reset []}
  prometheus: {profiles: !reset []}
  loki: {profiles: !reset []}
  grafana: {profiles: !reset []}
