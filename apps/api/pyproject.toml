[project]
name = "ledgerline-api"
version = "0.1.0"
description = "Ledgerline HTTP API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.122",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "strawberry-graphql>=0.339.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
