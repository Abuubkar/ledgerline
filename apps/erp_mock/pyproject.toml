[project]
name = "ledgerline-erp-mock"
version = "0.1.0"
description = "A stand-in for the company's ERP: purchase orders and goods receipts behind a flaky, paginated API"
requires-python = ">=3.13"
dependencies = [
    "ledgerline-telemetry",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
ledgerline-telemetry = { workspace = true }
