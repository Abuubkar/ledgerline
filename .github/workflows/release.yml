# Every push to main and every v* tag: build multi-arch images, push them to GHCR with an SBOM and provenance
# attestation, scan them, and sign the ones that pass. Migrations are rendered as SQL for review; nothing applies them.
# Every third-party action is pinned to a full commit SHA (the version is in the comment next to it).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cut a push or a signature off halfway

permissions:
  contents: read

jobs:
  images:
    name: images (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # push to ghcr.io
      id-token: write  # cosign keyless signing with the workflow's GitHub OIDC identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, file: Dockerfile, target: api }
          - { service: worker, file: Dockerfile, target: worker }
          - { service: erp-mock, file: Dockerfile, target: erp-mock }
          - { service: web, file: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LEDGERLINE_VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan (trivy; fails on a fixable CRITICAL vulnerability)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE@$DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.4 }
      - name: Sign (only images that passed the scan)
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Summary
        env: { DIGEST: "${{ steps.build.outputs.digest }}", TAGS: "${{ steps.meta.outputs.tags }}" }
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "\`$IMAGE@$DIGEST\`, signed; tags: $(echo "$TAGS" | sed 's/.*://' | paste -sd ' ' -)"
          } >> "$GITHUB_STEP_SUMMARY"

  migrations-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --locked
      - name: Render every migration as SQL, for review before anyone applies them
        run: mkdir -p build && uv run alembic upgrade head --sql > build/migrations.sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations-sql-${{ github.sha }}
          path: build/migrations.sql
