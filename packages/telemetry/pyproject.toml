[project]
name = "ledgerline-telemetry"
version = "0.1.0"
description = "One OpenTelemetry setup for every Ledgerline service: traces over OTLP, with sensitive attributes dropped"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-botocore==0.66b0",
    "opentelemetry-instrumentation-celery==0.66b0",
    "structlog==26.1.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
