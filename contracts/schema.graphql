type AgentRun {
  id: UUID!
  status: String!
  stopReason: String
  model: String!
  promptVersion: String!
  toolTurns: Int!
  guardFires: Int!
  llmMs: Int!
  startedAt: DateTime!
  finishedAt: DateTime
  steps: [AgentStep!]!
}

type AgentStep {
  stepNo: Int!
  kind: String!
  content: String
  toolName: String
  arguments: JSON
  result: JSON
  error: String
  llmMs: Int
}

scalar BigInt

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

union DecisionResult = DecisionSuccess | VersionConflict | NotFound

type DecisionSuccess {
  pendingAction: PendingAction!
}

"""Goods received against a purchase order."""
type GoodsReceipt {
  id: UUID!
  receivedOn: Date!
  lines: [ReceiptLine!]!
}

type Invoice {
  id: UUID!
  status: String!
  originalFilename: String!
  pageCount: Int
  invoiceNumber: String
  poNumber: String
  invoiceDate: Date
  dueDate: Date
  currency: String
  subtotal: Money
  tax: Money
  total: Money
  invalidFields: JSON
  fieldConfidence: JSON
  errorCode: String
  errorDetail: String
  model: String
  promptVersion: String
  llmMs: Int
  repairAttempted: Boolean!
  pages: [PageResult!]!
  match: MatchResult
  createdAt: DateTime!
  vendor: Vendor
  vendorName: String @deprecated(reason: "Use vendor.name.")
  vendorTaxId: String @deprecated(reason: "Use vendor.taxId.")
  lines: [InvoiceLine!]!

  """
  The purchase order the invoice cites, if it has been synced from the ERP.
  """
  purchaseOrder: PurchaseOrder

  """Goods receipts for the purchase order the invoice cites, oldest first."""
  goodsReceipts: [GoodsReceipt!]!

  """The agent's latest proposal for this invoice, decided or not."""
  pendingAction: PendingAction

  """Agent runs on this invoice, newest first, each with its full trace."""
  agentRuns: [AgentRun!]!
}

type InvoiceConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [InvoiceEdge!]!
}

"""An edge in a connection."""
type InvoiceEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Invoice!
}

type InvoiceLine {
  pageNo: Int!
  lineNo: Int!
  description: String
  quantity: String
  unitPrice: String
  amount: Money
  invalidReason: String
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type MatchReason {
  code: String!
  detail: String!
  line: String
}

type MatchResult {
  status: String!
  purchaseOrderId: UUID
  reasons: [MatchReason!]!
  matchedAt: DateTime!
}

type Money {
  amountMinor: BigInt!
  currency: String!
}

type Mutation {
  """Approve a pending action at the version the reviewer saw."""
  approvePendingAction(id: UUID!, expectedVersion: Int!, note: String = null): DecisionResult!

  """Reject a pending action at the version the reviewer saw."""
  rejectPendingAction(id: UUID!, expectedVersion: Int!, note: String = null): DecisionResult!
}

type NotFound {
  id: UUID!
}

"""Information to aid in pagination."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

type PageResult {
  pageNo: Int!
  status: String!

  """
  text: read from the PDF's text layer; image: rendered and read visually (a scan).
  """
  source: String!
  errorCode: String
  llmMs: Int
}

type PendingAction {
  id: UUID!
  invoiceId: UUID!
  actionType: String!
  status: String!
  details: JSON!
  version: Int!
  decisionNote: String
  createdAt: DateTime!
  decidedAt: DateTime
}

type PoLine {
  lineNo: Int!
  description: String!
  quantity: String!
  unitPrice: String!
}

"""A purchase order as last synced from the ERP."""
type PurchaseOrder {
  id: UUID!
  poNumber: String!
  status: String!
  currency: String!
  lines: [PoLine!]!
}

type Query {
  invoice(id: UUID!): Invoice
  invoices(first: Int! = 25, after: String = null, status: String = null): InvoiceConnection!

  """Invoices in `exception`, newest first: what a reviewer works through."""
  exceptionsQueue(first: Int! = 25, after: String = null): InvoiceConnection!
}

type ReceiptLine {
  poLineNo: Int!
  quantity: String!
}

scalar UUID

type Vendor {
  id: UUID!
  name: String!
  taxId: String
}

"""
Someone else decided first, or the version is stale: reload and decide again.
"""
type VersionConflict {
  currentVersion: Int!
  pendingAction: PendingAction!
}
