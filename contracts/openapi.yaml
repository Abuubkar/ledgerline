openapi: 3.1.0
info:
  title: Ledgerline
  version: 0.5.0
  description: |
    Accounts-payable automation. This file is the source of truth for the HTTP API: the app is checked
    against it with `make contract-check`, and the typed clients are generated from it with `make codegen`.

    **Idempotency.** `POST /v1/invoices` requires an `Idempotency-Key` (a UUID), following
    draft-ietf-httpapi-idempotency-key-header-08. A retry with the same key and the same files returns the
    stored response with `Idempotent-Replayed: true`. Keys expire after 24 hours. Missing key → 400; same key
    with different files → 422; same key while the first request is still running → 409.

    **Errors** use RFC 9457 `application/problem+json` with a stable `code`.

    **Extraction is queued.** An upload stores the PDF and returns 202 with status `received`; a worker
    extracts it page by page and the status moves to `extracting`, then one of: `extracted`;
    `partially_extracted` (some pages failed, see `pages`); `exception` (the totals don't add up even after
    one repair attempt, or it's a second copy of an invoice we already have from the same vendor; see
    `invalid_fields`); or `failed` (the job was dead-lettered). Poll
    `GET /v1/invoices/{invoice_id}`. When the queue is full, uploads get 429 with `Retry-After`.

    **Money** is always `{amount_minor, currency}`: an integer count of the currency's minor unit (cents,
    yen) and an ISO-4217 code. Never a float.
servers:
  - url: http://localhost:8000
paths:
  /v1/invoices:
    post:
      operationId: uploadInvoices
      summary: Upload 1–50 invoice PDFs for extraction
      description: |
        Each PDF is stored and queued for extraction; the response comes back before the model runs.
        One file returns 202 with the invoice in status `received` (or an error status); several return 207
        with one result per file, so a bad file never fails the others. When more than the configured number
        of extraction jobs are waiting, the whole request gets 429 with `Retry-After` and nothing is stored.

        A file whose content is already stored (same normalized text, or the same bytes for PDFs without
        a text layer) is a duplicate: 409 with a link to the original. Failed extractions don't count as
        duplicates, so the same invoice can be re-uploaded after a model outage.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadInvoicesBody'
      responses:
        '202':
          description: One file, stored and queued for extraction (status `received`).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '207':
          description: Several files; one result per file, in upload order.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          description: Too many extraction jobs waiting; retry after the number of seconds in `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listInvoices
      summary: List invoices, newest first, with keyset pagination
      description: |
        Pass `next_cursor` from one page as `cursor` to get the next. Cursors are opaque, signed and bound
        to the filters they were issued with: a tampered cursor, or one reused with different filters, is
        rejected with 400 `invalid_cursor`.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/InvoiceStatus'
              - type: 'null'
        - name: created_after
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: date-time
              - type: 'null'
      responses:
        '200':
          description: One page of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      summary: Get one invoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/admin/dead-letters:
    get:
      operationId: listDeadLetters
      summary: List extraction jobs that gave up, newest first
      description: |
        A job is dead-lettered when it hits a permanent error (a corrupt PDF, unusable model output) or runs
        out of retries for a transient one (model or storage unavailable). Keyset pagination as for invoices.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
      responses:
        '200':
          description: One page of dead letters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterPage'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/admin/dead-letters/{dead_letter_id}/replay:
    post:
      operationId: replayDeadLetter
      summary: Queue a dead-lettered job again with a fresh retry budget
      description: |
        The invoice goes back to `received` and is extracted again. Replaying the same dead letter twice
        does nothing the second time: it returns 200 with the original `replayed_at`.
      parameters:
        - name: dead_letter_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Queued again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
        '200':
          description: Already replayed earlier; nothing was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUID identifying this upload. Reuse it to retry safely.
        Declared with a pattern rather than `format: uuid` because openapi-python-client 0.29.1 passes a
        `uuid.UUID` object into the header, which httpx rejects (see docs/adr/0007).
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  headers:
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay of an earlier request.
      schema:
        type: string
        enum: ['true']
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UploadInvoicesBody:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: binary
            contentMediaType: application/octet-stream
          description: PDF files. A file sent with any other content type gets a 415 result.
    InvoiceStatus:
      type: string
      description: |
        received → extracting → extracted | partially_extracted | exception, or failed when the job is
        dead-lettered. Precedence when several apply: failed > partially_extracted > exception > extracted.
      enum: [received, extracting, extracted, partially_extracted, exception, failed]
    PageStatus:
      type: string
      description: blank pages (e.g. the back of a scan) are skipped, not failed.
      enum: [extracted, blank, failed]
    PageResult:
      type: object
      required: [page_no, status, source, error_code, llm_ms]
      properties:
        page_no:
          type: integer
        status:
          $ref: '#/components/schemas/PageStatus'
        source:
          type: string
          enum: [text, image]
          description: text when the page has a text layer; image when it was rendered and read visually.
        error_code:
          anyOf:
            - type: string
            - type: 'null'
        llm_ms:
          anyOf:
            - type: integer
            - type: 'null'
    InvoiceLine:
      type: object
      required: [page_no, line_no, description, quantity, unit_price, amount, invalid_reason]
      properties:
        page_no:
          type: integer
        line_no:
          type: integer
        description:
          anyOf:
            - type: string
            - type: 'null'
        quantity:
          anyOf:
            - type: string
            - type: 'null'
          description: Decimal as a string (e.g. "2.5"), so no precision is lost to JSON floats.
        unit_price:
          anyOf:
            - type: string
            - type: 'null'
          description: Decimal as a string; may have more decimals than the currency (e.g. "0.125").
        amount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        invalid_reason:
          anyOf:
            - type: string
            - type: 'null'
          description: Why a value on this line couldn't be used, if any.
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Integer count of the currency's minor unit.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Vendor:
      type: object
      required:
        - id
        - name
        - tax_id
      properties:
        id:
          type: string
          format: uuid
        name:
          description: The name as first seen; individual invoices may spell it differently.
          type: string
        tax_id:
          description: Uppercase letters and digits only; country prefixes are kept (DE812345678).
          anyOf:
            - type: string
            - type: 'null'
    Invoice:
      type: object
      required:
        - id
        - status
        - original_filename
        - page_count
        - vendor
        - vendor_name
        - vendor_tax_id
        - invoice_number
        - invoice_date
        - due_date
        - currency
        - subtotal
        - tax
        - total
        - field_confidence
        - invalid_fields
        - error_code
        - error_detail
        - model
        - prompt_version
        - prompt_tokens
        - output_tokens
        - llm_ms
        - repair_attempted
        - pages
        - lines
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        original_filename:
          type: string
        page_count:
          anyOf:
            - type: integer
            - type: 'null'
        vendor:
          description: |
            The vendor this invoice is from, recognized by its tax ID (or by its name when it prints none).
            Null until the invoice is extracted, or when it shows neither.
          anyOf:
            - $ref: '#/components/schemas/Vendor'
            - type: 'null'
        vendor_name:
          description: Same as vendor.name. Kept for existing clients; use vendor instead.
          deprecated: true
          anyOf:
            - type: string
            - type: 'null'
        vendor_tax_id:
          description: Same as vendor.tax_id. Kept for existing clients; use vendor instead.
          deprecated: true
          anyOf:
            - type: string
            - type: 'null'
        invoice_number:
          anyOf:
            - type: string
            - type: 'null'
        invoice_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        due_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        currency:
          anyOf:
            - type: string
              pattern: '^[A-Z]{3}$'
            - type: 'null'
        subtotal:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        tax:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        field_confidence:
          anyOf:
            - type: object
              additionalProperties:
                type: number
            - type: 'null'
        invalid_fields:
          description: Fields the model returned in a shape that couldn't be used, with the reason.
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        error_code:
          description: Why extraction failed, when `status` is `failed`.
          anyOf:
            - type: string
            - type: 'null'
        error_detail:
          anyOf:
            - type: string
            - type: 'null'
        model:
          anyOf:
            - type: string
            - type: 'null'
        prompt_version:
          anyOf:
            - type: string
            - type: 'null'
        prompt_tokens:
          anyOf:
            - type: integer
            - type: 'null'
        output_tokens:
          anyOf:
            - type: integer
            - type: 'null'
        llm_ms:
          anyOf:
            - type: integer
            - type: 'null'
          description: Total model time across all pages and any repair call.
        repair_attempted:
          type: boolean
          description: True when the totals didn't add up and the model was asked once to re-read them.
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageResult'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        created_at:
          type: string
          format: date-time
    InvoicePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        next_cursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          anyOf:
            - type: string
            - type: 'null'
    UploadResult:
      type: object
      required: [filename, status, invoice, problem]
      properties:
        filename:
          type: string
        status:
          type: integer
          description: The HTTP status this file would have had on its own (202, 409, 415, ...).
        invoice:
          anyOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        problem:
          anyOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
    MultiStatus:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UploadResult'
    ProblemCode:
      type: string
      enum:
        - invalid_request
        - idempotency_key_missing
        - idempotency_key_reused
        - request_in_progress
        - too_many_files
        - unsupported_media_type
        - duplicate_invoice
        - invalid_cursor
        - not_found
        - queue_full
    DeadLetter:
      type: object
      required: [id, task_name, invoice_id, error_code, exception_chain, attempts, created_at, replayed_at]
      properties:
        id:
          type: string
          format: uuid
        task_name:
          type: string
        invoice_id:
          type: string
          format: uuid
        error_code:
          type: string
          description: Why the job gave up, e.g. unreadable_pdf, model_unavailable.
        exception_chain:
          type: string
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        replayed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    DeadLetterPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI identifying the problem type.
        title:
          type: string
        status:
          type: integer
        detail:
          anyOf:
            - type: string
            - type: 'null'
        code:
          $ref: '#/components/schemas/ProblemCode'
        duplicate_of:
          description: For `duplicate_invoice`, the id of the invoice already stored.
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        duplicate_of_url:
          description: For `duplicate_invoice`, the path of the invoice already stored.
          anyOf:
            - type: string
            - type: 'null'
