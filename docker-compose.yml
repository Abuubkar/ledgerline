services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "5434:5432"  # 5432/5433 are used by other local projects
    volumes:
      # Postgres 18 images moved PGDATA under /var/lib/postgresql/18/; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI and API (queue depth for backpressure)
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-ledgerline.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploaded PDFs (MinIO's community edition is archived; see ADR 0008).
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    environment:
      AWS_ACCESS_KEY_ID: ledgerline
      AWS_SECRET_ACCESS_KEY: ledgerline-secret
      S3_BUCKET: invoices
    ports:
      - "8333:8333"
    volumes:
      - seaweeddata:/data

  # The worker, relay, beat and ERP mock run the app image; the API still runs on the host during development.
  worker:
    build: .
    image: ledgerline:dev
    command: ["celery", "-A", "ledgerline_api.worker", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@postgres:5432/ledgerline
      BROKER_URL: amqp://ledgerline:ledgerline@rabbitmq:5672//
      RABBITMQ_MANAGEMENT_URL: http://ledgerline:ledgerline@rabbitmq:15672
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      # Ollama runs natively on the Mac (Docker on macOS has no GPU). The chaos test points this at a stub.
      OLLAMA_HOST: ${WORKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      ERP_BASE_URL: http://erp_mock:8100
      # Telemetry goes to the collector only with TRACING=1 (and `--profile observability` to run it); otherwise it's off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://otel-collector:4318}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_started}

  relay:
    image: ledgerline:dev
    command: ["python", "-m", "ledgerline_api.relay"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # Exactly one beat: it sends sync_erp on schedule (two would send every sync twice). The schedule file
  # lives in the container and is recreated on restart, which only means one sync runs straight away.
  beat:
    image: ledgerline:dev
    command: ["celery", "-A", "ledgerline_api.worker", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      rabbitmq: {condition: service_healthy}

  # A stand-in for the company ERP (apps/erp_mock), serving the purchase orders scripts/seed.py wrote.
  erp_mock:
    image: ledgerline:dev
    command: ["uvicorn", "ledgerline_erp_mock.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      ERP_DATASET: /data/erp/dataset.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://otel-collector:4318}
      ERP_ERROR_RATE: ${ERP_ERROR_RATE:-0}
      ERP_LATENCY_MS: ${ERP_LATENCY_MS:-0}
    ports:
      - "8100:8100"
    volumes:
      - ./data/erp:/data/erp:ro

  # Observability (ADR 0020, ADR 0021), only with --profile observability. Services send OTLP to the collector, which
  # tail-samples traces into Jaeger, writes metrics to Prometheus and logs to Loki. Grafana (http://localhost:3001)
  # shows the "Ledgerline / Pipeline" dashboard; Jaeger's UI is http://localhost:16686.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-20}
    ports:
      - "4318:4318"
    depends_on: [jaeger, prometheus, loki]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver",
              "--enable-feature=exemplar-storage", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.9
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # development only: no login to look at the dashboard
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, jaeger]

volumes:
  pgdata:
  prometheusdata:
  lokidata:
  rabbitmqdata:
  seaweeddata:
